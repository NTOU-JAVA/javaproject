<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <style>
      .title { font: 700 34px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #172033; }
      .note { font: 15px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #5d6b82; }
      .layer-title { font: 700 24px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #172033; }
      .caption { font: 14px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #64748b; }
      .box-title { font: 700 18px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #172033; }
      .box-text { font: 14px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #42526b; }
      .layer { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .ui { fill: #eef6ff; stroke: #4c8eda; stroke-width: 2; }
      .service { fill: #f0fbf4; stroke: #42a164; stroke-width: 2; }
      .persist { fill: #fff7e8; stroke: #d99b2b; stroke-width: 2; }
      .model { fill: #f5f0ff; stroke: #8b6bd9; stroke-width: 2; }
      .external { fill: #fff1f1; stroke: #d35f5f; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="950" fill="#ffffff"/>
  <text x="70" y="70" class="title">學生行程與任務管理系統 - 系統架構圖</text>
  <text x="70" y="102" class="note">以 Layer 分層方式整理系統：UI 負責操作畫面，Service 處理功能邏輯，Persistence 負責儲存，Model 定義資料格式。</text>

  <rect x="55" y="135" width="1490" height="160" class="layer"/>
  <text x="80" y="172" class="layer-title">UI Layer：Swing 使用者介面</text>
  <text x="80" y="195" class="caption">負責畫面呈現、使用者操作、功能頁切換與通知顯示。</text>
  <rect x="80" y="220" width="190" height="58" class="ui" rx="10"/><text x="100" y="245" class="box-title">MainFrame</text><text x="100" y="267" class="box-text">主視窗 / CardLayout</text>
  <rect x="300" y="220" width="190" height="58" class="ui" rx="10"/><text x="320" y="245" class="box-title">CalendarPanel</text><text x="320" y="267" class="box-text">任務行事曆</text>
  <rect x="520" y="220" width="190" height="58" class="ui" rx="10"/><text x="540" y="245" class="box-title">TodoPanel</text><text x="540" y="267" class="box-text">代辦事項</text>
  <rect x="740" y="220" width="190" height="58" class="ui" rx="10"/><text x="760" y="245" class="box-title">SchedulePanel</text><text x="760" y="267" class="box-text">課表管理</text>
  <rect x="960" y="220" width="190" height="58" class="ui" rx="10"/><text x="980" y="245" class="box-title">SchoolNewsPanel</text><text x="980" y="267" class="box-text">公告列表</text>
  <rect x="1180" y="220" width="190" height="58" class="ui" rx="10"/><text x="1200" y="245" class="box-title">TrayManager</text><text x="1200" y="267" class="box-text">系統匣通知</text>

  <rect x="55" y="330" width="1490" height="210" class="layer"/>
  <text x="80" y="367" class="layer-title">Service Layer：核心功能與資料處理</text>
  <text x="80" y="390" class="caption">負責時間判斷、同步、PDF 解析、公告爬蟲、分類管理與登入狀態等業務邏輯。</text>
  <rect x="80" y="418" width="215" height="68" class="service" rx="10"/><text x="100" y="445" class="box-title">ReminderService</text><text x="100" y="467" class="box-text">每 30 秒掃描提醒</text>
  <rect x="325" y="418" width="215" height="68" class="service" rx="10"/><text x="345" y="445" class="box-title">TronclassService</text><text x="345" y="467" class="box-text">Cookie 同步待辦</text>
  <rect x="570" y="418" width="235" height="68" class="service" rx="10"/><text x="590" y="445" class="box-title">PdfScheduleImporter</text><text x="590" y="467" class="box-text">PDF 文字座標轉課表</text>
  <rect x="835" y="418" width="245" height="68" class="service" rx="10"/><text x="855" y="445" class="box-title">SchoolNewsCrawler</text><text x="855" y="467" class="box-text">jsoup 抓取公告</text>
  <rect x="1110" y="418" width="215" height="68" class="service" rx="10"/><text x="1130" y="445" class="box-title">CategoryManager</text><text x="1130" y="467" class="box-text">分類管理 / listener</text>
  <rect x="80" y="500" width="215" height="50" class="service" rx="10"/><text x="100" y="532" class="box-title">SessionManager</text>
  <rect x="325" y="500" width="215" height="50" class="service" rx="10"/><text x="345" y="532" class="box-title">NtouCseScraper</text>

  <rect x="55" y="575" width="710" height="155" class="layer"/>
  <text x="80" y="612" class="layer-title">Persistence Layer：資料儲存</text>
  <text x="80" y="635" class="caption">負責把 Java 物件轉成 XML / properties / txt，並在啟動時讀回。</text>
  <rect x="80" y="655" width="260" height="70" class="persist" rx="10"/><text x="100" y="683" class="box-title">XmlDataStore</text><text x="100" y="706" class="box-text">Task / Todo / Schedule XML</text>
  <rect x="380" y="655" width="285" height="70" class="persist" rx="10"/><text x="400" y="683" class="box-title">TronclassSessionStore</text><text x="400" y="706" class="box-text">Cookie / 使用者資訊</text>

  <rect x="815" y="575" width="730" height="155" class="layer"/>
  <text x="840" y="612" class="layer-title">Model Layer：資料模型</text>
  <text x="840" y="635" class="caption">定義系統內部資料格式，讓 UI、Service、Persistence 用同一套物件溝通。</text>
  <rect x="840" y="655" width="125" height="48" class="model" rx="10"/><text x="868" y="686" class="box-title">Task</text>
  <rect x="985" y="655" width="125" height="48" class="model" rx="10"/><text x="1010" y="686" class="box-title">TodoItem</text>
  <rect x="1130" y="655" width="125" height="48" class="model" rx="10"/><text x="1150" y="686" class="box-title">Reminder</text>
  <rect x="1275" y="655" width="125" height="48" class="model" rx="10"/><text x="1295" y="686" class="box-title">Schedule</text>
  <rect x="1415" y="655" width="105" height="48" class="model" rx="10"/><text x="1438" y="686" class="box-title">Course</text>
  <rect x="840" y="710" width="125" height="48" class="model" rx="10"/><text x="862" y="741" class="box-title">NewsItem</text>

  <rect x="55" y="780" width="1490" height="115" class="layer"/>
  <text x="80" y="817" class="layer-title">External / Data：外部來源與本機檔案</text>
  <text x="80" y="840" class="caption">系統會從外部網站或檔案取得資料，也會把使用者資料保存在本機。</text>
  <rect x="80" y="855" width="255" height="48" class="external" rx="10"/><text x="103" y="886" class="box-title">Tronclass API</text>
  <rect x="370" y="855" width="255" height="48" class="external" rx="10"/><text x="392" y="886" class="box-title">PDF 課表檔</text>
  <rect x="660" y="855" width="255" height="48" class="external" rx="10"/><text x="682" y="886" class="box-title">學校 / 系所網站</text>
  <rect x="950" y="855" width="385" height="48" class="external" rx="10"/><text x="972" y="886" class="box-title">data XML / txt / properties</text>
</svg>
